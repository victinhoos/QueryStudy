version: '3.8'

services:
  app:
    build: .
    container_name: PHP_QueryStudy
    ports:
      - "${APP_PORT}:80"  
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - dados_mysql:/var/lib/mysql

volumes:
  dados_mysql: